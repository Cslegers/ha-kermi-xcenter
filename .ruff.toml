# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

# Everything under custom_components is generated by scripts/vendor_sync and
# linted upstream: the integration against Home Assistant core's own ruff rules
# in the kermi-xcenter-core repository, and the vendored library against its own
# in kermi-xcenter-modbus. Re-linting it here under a different rule set would
# only produce findings that cannot be fixed in this repository.
exclude = ["custom_components"]

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
# Tests assert, print their findings, and import fixtures by side effect.
"tests/*" = [
    "S101",   # tests assert
    "T201",   # the live test prints what it found, which is the point of it
    "INP001", # pytest collects these without an __init__.py
    "ANN001", # fixture parameters are typed by pytest, not by us
    "ANN201",
    "ARG001", # a fixture requested for its side effect is not "unused"
    "D213",   # conflicts with D212, which this configuration already ignores
    "TC002",  # runtime imports are clearer in a test than a TYPE_CHECKING block
]
