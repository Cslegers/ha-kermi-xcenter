name: Vendor sync

# custom_components/ is generated by scripts/vendor_sync from the two upstream
# repositories. Regenerate it here and fail if the committed result differs, so
# a hand-edit of the generated copy cannot go unnoticed.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  in-sync:
    name: Generated code matches its sources
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out the device library
        uses: actions/checkout@v6
        with:
          repository: slegerscm-ops/kermi-xcenter-modbus
          path: .sources/kermi-xcenter-modbus
          persist-credentials: false

      - name: Check out the core integration
        uses: actions/checkout@v6
        with:
          repository: slegerscm-ops/kermi-xcenter-core
          path: .sources/kermi-xcenter-core
          persist-credentials: false

      - name: Regenerate
        env:
          LIBRARY_REPO: .sources/kermi-xcenter-modbus
          CORE_REPO: .sources/kermi-xcenter-core
        run: ./scripts/vendor_sync

      - name: Fail if the result differs from what is committed
        run: |
          # VENDORED_FROM records the library commit, which legitimately moves.
          if ! git diff --quiet -- custom_components \
              ':!custom_components/kermi_xcenter/vendor/kermi_xcenter_modbus/VENDORED_FROM'; then
            echo "::error::custom_components is out of date with its sources."
            echo "Run ./scripts/vendor_sync and commit the result."
            git diff --stat -- custom_components
            exit 1
          fi
          echo "Generated code matches its sources."
